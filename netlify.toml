# Netlify configuration: picked up automatically when the repository is imported.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Live URL: enables canonical URLs and sitemap.xml in the build.
  SITE_URL = "https://geoexcel-redesign.netlify.app"

# Basic security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Short caching for static assets (file names aren't fingerprinted, so keep updates visible quickly).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
